<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<style>
:root{
  --bg:#0b0f14;
  --card:#121821;
  --text:#e6edf3;
  --muted:#8b98a8;
  --accent:#7aa2f7;
  --accent-soft:rgba(122,162,247,.15);
  --border:rgba(255,255,255,.08);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa;
    --card:#ffffff;
    --text:#0b0f14;
    --muted:#5a6572;
    --accent:#3b82f6;
    --accent-soft:rgba(59,130,246,.12);
    --border:rgba(0,0,0,.08);
  }
}
[data-theme="light"]{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#0b0f14;
  --muted:#5a6572;
  --accent:#3b82f6;
  --accent-soft:rgba(59,130,246,.12);
  --border:rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#0b0f14;
  --card:#121821;
  --text:#e6edf3;
  --muted:#8b98a8;
  --accent:#7aa2f7;
  --accent-soft:rgba(122,162,247,.15);
  --border:rgba(255,255,255,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;
  background:
    radial-gradient(1200px 800px at 80% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(800px 600px at 10% 110%, rgba(122,162,247,.08), transparent 60%),
    var(--bg);
  color:var(--text);
  display:grid;
  place-items:center;
  padding:24px;
  min-height:100vh;
  overflow:hidden;
}
.app{
  width:min(820px,100%);
}
.card{
  position:relative;
  width:100%;
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0)) , var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  padding:48px 36px;
  backdrop-filter: blur(16px);
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(120deg, rgba(122,162,247,.35), transparent 30%, transparent 70%, rgba(122,162,247,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.decor{
  position:absolute;
  pointer-events:none;
  opacity:.35;
  filter:blur(40px);
}
.decor.a{width:220px;height:220px;background:radial-gradient(circle, var(--accent), transparent 60%);top:-80px;left:-60px;border-radius:50%;}
.decor.b{width:180px;height:180px;background:radial-gradient(circle, rgba(122,162,247,.6), transparent 60%);bottom:-70px;right:-50px;border-radius:50%;}
.grid-bg{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:32px 32px;
  mask:radial-gradient(ellipse at center, black 40%, transparent 75%);
  opacity:.25;
}
h1{
  margin:0 0 8px;
  font-size:clamp(28px,4vw,40px);
  font-weight:700;
  letter-spacing:-0.02em; 
display:flex;justify-content:center;
}
.subtitle{
  margin:0 0 32px;
  color:var(--muted);
  font-size:15px;
}
.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:600;
  font-size:13px;
  letter-spacing:.3px;
  text-transform:uppercase;
}
.status-icon{
  font-size:16px;
  line-height:1;
  transition:filter .3s ease, transform .3s ease;
}
.status-icon.glow-green{filter:drop-shadow(0 0 8px #22c55e) drop-shadow(0 0 16px rgba(34,197,94,.5));transform:scale(1.05)}
.status-icon.glow-red{filter:drop-shadow(0 0 8px #ef4444) drop-shadow(0 0 16px rgba(239,68,68,.5));transform:scale(1.05)}
.status-icon.glow-yellow{filter:drop-shadow(0 0 8px #eab308) drop-shadow(0 0 16px rgba(234,179,8,.5));transform:scale(1.05)}
.status-icon.dim{opacity:.7}
.timer{
  margin-top:28px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:16px;
}
.unit{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px 12px;
  text-align:center;
}
.unit-value{
  font-variant-numeric:tabular-nums;
  font-size:clamp(32px,6vw,48px);
  font-weight:800;
  line-height:1;
}
.unit-label{
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.12em;
}
.progress-wrap{
  margin:32px auto 0;
  max-width:520px;
  display:flex;
  align-items:center;
  gap:16px;
}
.progress-ring{
  width:84px;height:84px;flex:0 0 84px;
}
.progress-ring circle{
  fill:none;
  stroke-width:8;
  r:34;
  cx:42;cy:42;
}
.progress-ring .bg{stroke:rgba(255,255,255,.08)}
.progress-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.progress-label{font-size:13px;color:var(--muted)}
.progress-bar-wrap{
  margin-top:32px;
}
.progress-bar{
  height:10px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  border-radius:999px;
  overflow:hidden;
  position:relative;
}
.progress-bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--accent), #a78bfa);
  transition:width .5s ease;
  box-shadow:0 0 20px rgba(122,162,247,.35) inset;
}
.progress-bar-labels{
  display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)
}
a{color:var(--accent);text-decoration:none}
.theme-toggle{
  position:absolute;
  top:24px;
  right:24px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  cursor:pointer;
  transition:background .2s,color .2s;
}
.theme-toggle:hover{
  background:var(--accent-soft);
  color:var(--text);
}
.chicken-wrap{
  display:flex;justify-content:center;margin:8px 0 12px;
}
.chicken-emoji{
  font-size:72px;
  line-height:1;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));
}
.timer-selector{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:flex-start;
  margin:0 0 16px;
}
.timer-selector .timer-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  letter-spacing:.2px;
  text-decoration:none;
  transition:background .2s,color .2s,border-color .2s,transform .1s;
}
.timer-selector .timer-pill:hover{
  background:var(--accent-soft);
  color:var(--text);
  transform:translateY(-1px);
}
.timer-selector .timer-pill.active{
  background:var(--accent-soft);
  color:var(--accent);
  border-color:rgba(122,162,247,.5);
}
.timer-pill .pill-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--muted);
  flex:0 0 8px;
  transition:background .2s, box-shadow .2s;
}
.timer-pill .pill-cat{
  display:none;
  font-size:14px;
  line-height:1;
}
.timer-pill.active .pill-cat{
  display:inline;
}
.timer-pill .pill-dot.green{
  background:#22c55e;
  box-shadow:0 0 8px #22c55e;
}
.timer-pill.ended{
  opacity:.5;
  color:var(--muted);
}
.timer-pill.ended .pill-dot{
  background:var(--muted);
}
/* cat_snow effect */
.cat-snow-layer{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:50;
}
.cat-snow-cat{
  position:absolute;
  top:-10vh;
  color:var(--cat-snow-color, rgba(230,237,243,.85));
  animation:cat-snow-fall linear forwards;
  will-change:transform;
}
[data-theme="light"] .cat-snow-cat{
  color:rgba(11,15,20,.55);
}
@keyframes cat-snow-fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}
  10%{opacity:var(--cat-snow-opacity,.85)}
  90%{opacity:var(--cat-snow-opacity,.85)}
  100%{transform:translate3d(var(--cat-snow-drift,0px),115vh,0) rotate(var(--cat-snow-spin,180deg));opacity:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="timer-selector" id="timerSelector" aria-label="Timer selector"></div>
  <div class="card">
  <div class="decor a"></div>
  <div class="decor b"></div>
  <div class="grid-bg"></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌓 Theme</button>
  <div class="chicken-wrap">
    <div class="chicken-emoji" aria-hidden="true">🍔🍗🔥🍗🍔</div>
  </div>
  <h1 id="title">Timer</h1>
  <p class="subtitle"></p>
  <div class="status"><span class="status-icon" id="statusIcon">⏳</span><span id="statusText">Loading…</span></div>
  <div class="timer" id="timer">
    <div class="unit"><div class="unit-value" id="d">00</div><div class="unit-label">Дней</div></div>
    <div class="unit"><div class="unit-value" id="h">00</div><div class="unit-label">Часов</div></div>
    <div class="unit"><div class="unit-value" id="m">00</div><div class="unit-label">Минут</div></div>
    <div class="unit"><div class="unit-value" id="s">00</div><div class="unit-label">Секунд</div></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
    <div class="progress-bar-labels"><span id="progressLabelLeft">0%</span><span id="progressLabelRight">100%</span></div>
  </div>
  </div>
</div>

<script>
// Timers configuration
const timers = [
  {
    id: 'fast',
    name: 'ГОЛОДОВКА!!!',
    start: '2026-08-16T16:00:00',
    end: '2026-08-20T16:00:00',
    endBonus: '2026-08-21T16:00:00',
    messages: {
      notStarted: 'До начала голодовки',
      inProgress: 'Отсчет до конца голодовки',
      bonus: 'Бонусное время голодовки!!!',
      ended: '🐷🐷🍔🍗🍟🥓🐷🐷'
    },
    titles: {
      notStarted: 'Голодовка еще не началась!',
      inProgress: 'ГОЛОДОВКА!!!! 😫',
      bonus: 'БОНУСНАЯ ГОЛОДОВКА!!! 😫😫😫',
      ended: 'Голодовка завершена!'
    },
    units: ['Дней', 'Часов', 'Минут', 'Секунд'],
    chickenEmoji: '🍔🍗🐷🍗🍔',
    chickenEmojiBonus: '🐷🐷🐷🐷🐷',
    effect_name: '',
    roundDecs: '0'
  },
{
    id: 'ny',
    name: 'НОВЫЙ ГОД!!!',
    start: '2026-01-01T00:00:00',
    end: '2026-12-31T23:59:59',
    messages: {
      notStarted: 'Новый год еще не наступил!',
      inProgress: 'До нового года осталось',
      ended: 'НОВЫЙ ГОД!!!! 🎆'
    },
    titles: {
      notStarted: 'Старый год еще не закончился!',
      inProgress: 'СКОРО НОВЫЙ ГОД!!',
      ended: 'НОВЫЙ ГОД!!!!!!!!! 🐷🍔🎄'
    },
    units: ['Дней', 'Часов', 'Минут', 'Секунд'],
    chickenEmoji: '🎄🎄🎉🥳🎊🎄🎄',
    effect_name: 'cat_snow',
    roundDecs: 6
  },

];

(function initTheme(){
  const root = document.documentElement;
  const saved = localStorage.getItem('theme');
  const theme = saved || 'dark';
  root.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn){
    btn.textContent = theme === 'light' ? '🌙 Светло!!!' : '☀️ Темно!!!!';
    btn.addEventListener('click', ()=>{
      const current = root.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      btn.textContent = next === 'light' ? '🌙 Светло!!!' : '☀️ Темно!!!!';
    });
  }
})();

const STORAGE_KEY = 'selectedTimerId';

const titleEl = document.getElementById('title');
const statusEl = document.getElementById('statusText');
const statusIcon = document.getElementById('statusIcon');
const dEl = document.getElementById('d');
const hEl = document.getElementById('h');
const mEl = document.getElementById('m');
const sEl = document.getElementById('s');
const progressBarFill = document.getElementById('progressBarFill');
const progressLabelLeft = document.getElementById('progressLabelLeft');
const timerSelectorEl = document.getElementById('timerSelector');
const chickenEl = document.querySelector('.chicken-emoji');
const unitLabels = document.querySelectorAll('.unit-label');
const timerContainer = document.getElementById('timer');
const progressWrap = document.querySelector('.progress-bar-wrap');

function isValidTimerId(id){ return timers.some(t=>t.id===id); }

function parseHash(){ return location.hash.replace(/^#/,''); }

function getEffectiveEnd(t){
  if(t.endBonus && new Date(t.endBonus) > new Date(t.end)) return new Date(t.endBonus);
  return new Date(t.end);
}

function isEnded(t, now = new Date()){ return now > getEffectiveEnd(t); }

function findNextNotEnded(fromIndex, now){
  const n = timers.length;
  for(let step = 1; step <= n; step++){
    const i = (fromIndex + step) % n;
    if(!isEnded(timers[i], now)) return timers[i];
  }
  return null;
}

function lastEndedTimerId(now){
  let best = null;
  timers.forEach(t=>{
    if(isEnded(t, now)){
      if(!best || new Date(t.end) > new Date(best.end)) best = t;
    }
  });
  return best ? best.id : null;
}

function getInitialTimerId(){
  const now = new Date();
  // 1. Timer passed in URL
  const hashId = parseHash();
  if(hashId && isValidTimerId(hashId)) return hashId;

  // 2. Timer in local storage
  const stored = localStorage.getItem(STORAGE_KEY);
  if(stored && isValidTimerId(stored)){
    const storedIdx = timers.findIndex(t=>t.id===stored);
    if(isEnded(timers[storedIdx], now)){
      const next = findNextNotEnded(storedIdx, now);
      if(next) return next.id;
      return lastEndedTimerId(now) || stored;
    }
    return stored;
  }

  // 3. No timer in URL or local storage -> first not ended
  const firstNotEnded = timers.find(t=>!isEnded(t, now));
  if(firstNotEnded) return firstNotEnded.id;

  // 4. All timers ended -> last ended
  return lastEndedTimerId(now) || timers[0]?.id;
}

let currentTimerId = getInitialTimerId();
let currentTimer = null;
let start = null;
let end = null;

function getCurrentTimer(){ return timers.find(t=>t.id===currentTimerId) || timers[0]; }

function renderTimerSelector(){
  if(!timerSelectorEl) return;
  timerSelectorEl.innerHTML = '';
  timers.forEach(t=>{
    const a = document.createElement('a');
    a.href = '#'+t.id;
    a.className = 'timer-pill';
    a.dataset.timerId = t.id;
    const dot = document.createElement('span');
    dot.className = 'pill-dot';
    const cat = document.createElement('span');
    cat.className = 'pill-cat';
    cat.textContent = '\u{1F431}\u{FE0E}';
    const label = document.createElement('span');
    label.textContent = t.name;
    a.append(dot, cat, label);
    a.addEventListener('click', e=>{
      e.preventDefault();
      selectTimer(t.id);
    });
    timerSelectorEl.appendChild(a);
  });
}

function refreshPillStates(){
  const now = new Date();
  document.querySelectorAll('#timerSelector .timer-pill').forEach(el=>{
    const t = timers.find(x=>x.id===el.dataset.timerId);
    if(!t) return;
    const ended = isEnded(t, now);
    const inProgress = !ended && now >= new Date(t.start);
    el.classList.toggle('ended', ended);
    const dot = el.querySelector('.pill-dot');
    if(dot) dot.className = 'pill-dot' + (inProgress ? ' green' : '');
  });
}

function updateTimerSelectionUI(){
  document.querySelectorAll('[data-timer-id]').forEach(el=>{
    const active = el.dataset.timerId === currentTimerId;
    el.classList.toggle('active', active);
    el.setAttribute('aria-current', active ? 'true' : 'false');
  });
  refreshPillStates();
}

// --- Effects engine ---
let activeEffect = null;
let catSnowInterval = null;

function stopEffect(){
  if(catSnowInterval){ clearInterval(catSnowInterval); catSnowInterval = null; }
  const layer = document.getElementById('catSnowLayer');
  if(layer) layer.remove();
  activeEffect = null;
}

function spawnCat(){
  const layer = document.getElementById('catSnowLayer');
  if(!layer) return;
  const cat = document.createElement('span');
  cat.className = 'cat-snow-cat';
  cat.textContent = '\u{1F431}\u{FE0E}';
  const size = 14 + Math.random() * 30;
  const dur = 6 + Math.random() * 8;
  cat.style.left = (Math.random() * 100) + 'vw';
  cat.style.fontSize = size + 'px';
  cat.style.setProperty('--cat-snow-drift', (Math.random() * 160 - 80) + 'px');
  cat.style.setProperty('--cat-snow-spin', (Math.random() * 360 - 180) + 'deg');
  cat.style.setProperty('--cat-snow-opacity', (0.4 + Math.random() * 0.5).toFixed(2));
  cat.style.animationDuration = dur + 's';
  cat.addEventListener('animationend', ()=>cat.remove());
  layer.appendChild(cat);
}

function startCatSnow(){
  stopEffect();
  const layer = document.createElement('div');
  layer.className = 'cat-snow-layer';
  layer.id = 'catSnowLayer';
  document.body.appendChild(layer);
  spawnCat();
  catSnowInterval = setInterval(spawnCat, 350);
  activeEffect = 'cat_snow';
}

function applyEffect(name){
  if(name === activeEffect) return;
  stopEffect();
  if(name === 'cat_snow') startCatSnow();
}

function applyTimer(timer){
  if(!timer){
    titleEl.textContent = 'No times';
    statusEl.textContent = 'No times';
    statusIcon.textContent = '';
    if(timerContainer) timerContainer.style.display='none';
    if(progressWrap) progressWrap.style.display='none';
    if(timerSelectorEl) timerSelectorEl.style.display='none';
    stopEffect();
    return;
  }
  currentTimer = timer;
  applyEffect(timer.effect_name || '');
  start = new Date(timer.start);
  end = new Date(timer.end);
  if(chickenEl) chickenEl.textContent = timer.chickenEmoji || '';
  if(timer.units && unitLabels.length){
    unitLabels.forEach((el,i)=>{ if(timer.units[i]) el.textContent = timer.units[i]; });
  }
  updateTimerSelectionUI();
  update();
}

function selectTimer(id, {persist=true, updateHash=true}={}){
  if(!isValidTimerId(id)) return;
  currentTimerId = id;
  if(persist) localStorage.setItem(STORAGE_KEY, id);
  if(updateHash && location.hash.replace(/^#/,'') !== id){
    history.replaceState(null,'','#' + encodeURIComponent(id));
  }
  applyTimer(getCurrentTimer());
}

function pad(n){ return String(n).padStart(2,'0'); }

function update(){
  if(!currentTimer){
    dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = '--';
    progressBarFill.style.width = '0%';
    progressLabelLeft.textContent = 'No times';
    return;
  }
  const now = new Date();
  refreshPillStates();
  const effectiveEnd = getEffectiveEnd(currentTimer);
  let diff, state;
  if(now < start){
    state = 'not_started';
    diff = start - now;
    statusEl.textContent = currentTimer.messages.notStarted;
    titleEl.textContent = currentTimer.titles.notStarted;
    statusIcon.textContent = '⏳';
    statusIcon.className = 'status-icon dim';
  } else if(now >= start && now <= end){
    state = 'in_progress';
    diff = end - now;
    statusEl.textContent = currentTimer.messages.inProgress;
    titleEl.textContent = currentTimer.titles.inProgress;
    statusIcon.textContent = '🟢';
    statusIcon.className = 'status-icon glow-green';
  } else if(effectiveEnd > end && now > end && now <= effectiveEnd){
    state = 'bonus';
    diff = effectiveEnd - now;
    statusEl.textContent = currentTimer.messages.bonus || currentTimer.messages.inProgress;
    titleEl.textContent = currentTimer.titles.bonus || currentTimer.titles.inProgress;
    statusIcon.textContent = '🟡';
    statusIcon.className = 'status-icon glow-yellow';
  } else {
    state = 'ended';
    diff = 0;
    statusEl.textContent = currentTimer.messages.ended;
    titleEl.textContent = currentTimer.titles.ended;
    statusIcon.textContent = '🔴';
    statusIcon.className = 'status-icon glow-red';
  }
  const bonusEmoji = state === 'bonus' ? (currentTimer.chickenEmojiBonus || currentTimer.chickenEmoji) : currentTimer.chickenEmoji;
  if(chickenEl) chickenEl.textContent = bonusEmoji || '';
  if(diff < 0) diff = 0;
  const totalSec = Math.floor(diff/1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const minutes = Math.floor((totalSec % 3600) / 60);
  const seconds = totalSec % 60;
  dEl.textContent = pad(days);
  hEl.textContent = pad(hours);
  mEl.textContent = pad(minutes);
  sEl.textContent = pad(seconds);
  let pct;
  if(state === 'bonus'){
    const bonusTotal = effectiveEnd - end;
    const bonusElapsed = Math.max(0, Math.min(now - end, bonusTotal));
    pct = bonusTotal > 0 ? Math.max(0, Math.min(100, (bonusElapsed/bonusTotal)*100)) : 0;
  } else {
    const mainTotal = end - start;
    const mainElapsed = Math.max(0, Math.min(now - start, mainTotal));
    pct = mainTotal > 0 ? Math.max(0, Math.min(100, (mainElapsed/mainTotal)*100)) : 0;
  }
  progressBarFill.style.width = `${pct}%`;
  progressLabelLeft.textContent = `${pct.toFixed(currentTimer.roundDecs || 2)}%`;
}

// Self-correcting loop: aligns ticks to the next second boundary so the
// display never drifts, skips while the tab is hidden, and refreshes
// immediately when the tab becomes visible again (fixes 1s freezes and
// double-updates caused by setInterval throttling).
let updateTimeoutId = null;
function scheduleUpdate(){
  if(updateTimeoutId) clearTimeout(updateTimeoutId);
  const delay = 1000 - (Date.now() % 1000);
  updateTimeoutId = setTimeout(()=>{
    if(!document.hidden) update();
    scheduleUpdate();
  }, delay);
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) update();
});

if(timers.length === 0){
  titleEl.textContent = 'No times';
  statusEl.textContent = 'No times';
  statusIcon.textContent = '';
  if(timerContainer) timerContainer.style.display='none';
  if(progressWrap) progressWrap.style.display='none';
  if(timerSelectorEl) timerSelectorEl.style.display='none';
} else {
  renderTimerSelector();
  localStorage.setItem(STORAGE_KEY, currentTimerId);
  applyTimer(getCurrentTimer());
  update();
  scheduleUpdate();
}

document.addEventListener('click', e=>{
  const link = e.target.closest('[data-timer-id]');
  if(!link) return;
  e.preventDefault();
  selectTimer(link.dataset.timerId);
});

window.addEventListener('hashchange', ()=>{
  const hashId = parseHash();
  if(hashId && isValidTimerId(hashId)){
    currentTimerId = hashId;
    localStorage.setItem(STORAGE_KEY, hashId);
    applyTimer(getCurrentTimer());
  }
});
</script>
</body>
